# Where this data comes from and what was done to it.

source:
  name: 指定緊急避難場所・指定避難所データ (designated emergency evacuation sites and designated shelters)
  publisher: Geospatial Information Authority of Japan (GSI, 国土地理院)
  registrants: the municipalities, under the Disaster Countermeasures Basic Act Art. 49-4 and 49-7
  page: https://www.gsi.go.jp/bousaichiri/hinanbasho.html
  download_terms_page: https://hinanmap.gsi.go.jp/index.html
  listing_page: https://hinanmap.gsi.go.jp/hinanjocp/hinanbasho/koukaidate.html
  cautions: https://www.gsi.go.jp/bousaichiri/hinanbasho-menseki.html
  secondary_copies_not_used:
    - https://www.geospatial.jp/ckan/dataset/db74071f-cd0a-406d-ba3d-57c7a25d9925 (AIGID's Shapefile and GeoJSON made from GSI's data, sites only, June 2026)
  licence:
    applied: GSI Content Terms of Use -> PDL1.0, compatible with CC BY 4.0 (read 2026-10-06)
    terms: https://www.gsi.go.jp/kikakuchousei/kikakuchousei40182.html
    terms_amended: 2025-11-20
    pdl: https://www.digital.go.jp/resources/open_data/public_data_license_v1.0
    card: "license: cc-by-4.0"
    attribution_required: true
    indicate_changes: true
    no_impersonation: true
    commercial_use: true
    cautions_to_pass_on: true
    survey_act: not a survey result; GSI attaches no Survey Act notice to this data
  update_pattern: >-
    Overwritten in place; regenerated every morning (Last-Modified about 00:30 UTC).
    No release number. The listing shows a 最終更新日 per municipality and prefecture.
  crs: >-
    Not stated by GSI. Its GeoJSON has no crs member (RFC 7946: WGS 84 lon/lat);
    the GeoParquet leaves crs unset (OGC:CRS84). No reprojection.
  citation: 出典：国土地理院ウェブサイト（https://www.gsi.go.jp/bousaichiri/hinanbasho.html）

